# Alembic configuration for the JETTAE Ops SQL store.
#
#   alembic upgrade head                                  # URL from JETTAE_DATABASE_URL / .env / default
#   alembic -x url=postgresql+psycopg://u:p@host/db upgrade head
#   alembic -x url=postgresql://u@h/db upgrade head --sql # offline: print the DDL only
#
# The URL is resolved by src/jettae/store/migrations/env.py in this order:
#   -x url=...  >  sqlalchemy.url below (left empty on purpose)  >  JETTAE_DATABASE_URL  >  settings default

[alembic]
script_location = %(here)s/src/jettae/store/migrations
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
output_encoding = utf-8
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
