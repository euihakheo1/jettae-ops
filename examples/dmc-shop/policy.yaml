# 별빛상점 운영 정책 — 제때옵스(JETTAE Ops) 진단 기준
# 2026-10 개발팀 회의에서 합의한 값. 법정 신고 의무(침해사고 24시간, 개인정보 유출 72시간)는
# 회사가 정하는 값이 아니므로 obligations 항목을 두지 않고 제때옵스 기본값(법령 기준)을 그대로 쓴다.

# 핵심 서비스로 보는 등급. 이 등급의 서비스는 감지·담당·승인자·대체 채널·롤백 5요소를 모두 갖춰야 한다.
critical_tiers: [1, 2]

# 등급별 목표 복구 시간(분). 모의 장애 리허설에서 이 시간 안에 조치가 끝나야 '작동'으로 본다.
#   1등급 60분(결제·주문 등 매출 직결), 2등급 4시간, 3등급 하루
tier_slo_minutes:
  1: 60
  2: 240
  3: 1440

# 카탈로그에 등급이 없는 서비스는 2등급으로 본다(모르면 가볍게 보지 않는다).
default_tier: 2

# 당직 피로도 기준(팀 합의). 위반은 '당직표 점검' 항목으로 표시만 하고,
# 대기 시간이 법적 근로시간인지는 판단하지 않는다(대법원 2024.11.14. 2021다220062 판결 기준 참고).
fatigue:
  max_consecutive_night_shifts: 2   # 야간 당직 연속 최대 2일
  min_rest_hours: 11                # 당직과 당직 사이 최소 휴식 11시간
  night_start_hour: 22              # 야간으로 보는 시작 시각(22시)
  night_end_hour: 6                 # 야간으로 보는 끝 시각(06시)
  max_shifts_per_week: 3            # 1인당 주 최대 당직 3회

# 상향(에스컬레이션)이 여기서 끝나도 되는 최종 책임자 역할.
# 상향 경로가 이 역할에 닿지 못하고 끝나거나 돌기만 하면 '상향 끊김'으로 본다.
terminal_roles: [CTO, 대표, CEO, CISO]

# 침해사고·개인정보 유출 신고 의무를 적용할 서비스(고객 결제·주문 정보를 다루는 서비스).
regulated_services: [결제, 주문]
